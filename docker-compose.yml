version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: gridmind_postgres
    restart: always
    environment:
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: gridmind_password
      POSTGRES_DB: gridmind_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gridmind_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
